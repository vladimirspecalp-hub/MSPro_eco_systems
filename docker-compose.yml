version: '3.8'
services:
  app:
    build: .
    ports:
      - "5005:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:your_password@host.docker.internal:5432/postgres
      - OPENAI_API_KEY=${OPENAI_API_KEY}

    extra_hosts:
      - "host.docker.internal:host-gateway"
